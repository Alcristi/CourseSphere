log_format safe_json escape=json '{"event":"gateway_request","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"upstream":"$upstream_addr"}';
access_log /var/log/nginx/access.log safe_json;

limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=query:10m rate=30r/m;
limit_req_status 429;

upstream coursesphere_backend {
    server backend_a:5000;
    server backend_b:5000;
}

server {
    listen 80;
    server_name _;

    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /users/create {
        limit_req zone=signup burst=2 nodelay;
        proxy_pass http://coursesphere_backend;
    }

    location = /users/query {
        limit_req zone=query burst=5 nodelay;
        proxy_pass http://coursesphere_backend;
    }

    location = /metrics {
        return 404;
    }

    location ~ ^/(users|chats|courses|my|hash|health|ready)(/|$) {
        proxy_pass http://coursesphere_backend;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
